name: Playerbots solo target claims

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playerbots-target-claims-${{ github.ref }}
  cancel-in-progress: true

jobs:
  durable:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: 1.93.0
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_PROFILE_RELEASE_DEBUG: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: collection
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: LyraCoreProject/LyraCore
          ref: eba3a6e1303ed2c83c699e58ea236ba102725408
          path: lyracore
          persist-credentials: false
      - name: Install pinned Rust and SpacetimeDB
        run: |
          rustup toolchain install 1.93.0 --profile minimal
          rustup target add wasm32-unknown-unknown --toolchain 1.93.0
          archive="$RUNNER_TEMP/spacetime.tar.gz"
          curl --fail --location --retry 3 \
            https://github.com/clockworklabs/SpacetimeDB/releases/download/v2.7.1/spacetime-x86_64-unknown-linux-gnu.tar.gz \
            --output "$archive"
          printf '%s  %s\n' 9b58192135733083479f30aba47dbbbc79b51db368c46cc221baa663e9c3a2c1 "$archive" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/spacetime"
          tar -xzf "$archive" -C "$RUNNER_TEMP/spacetime"
          ln -s spacetimedb-cli "$RUNNER_TEMP/spacetime/spacetime"
          echo "$RUNNER_TEMP/spacetime" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: lyracore
      - name: Verify solo target claims through the Runner
        run: ./collection/.github/check-playerbots-target-claims-behavior.sh "$GITHUB_WORKSPACE/lyracore"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: playerbots-target-claims-evidence
          path: /tmp/lyracore-standalone-logs/
          if-no-files-found: error
