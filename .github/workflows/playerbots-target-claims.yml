name: Playerbots solo target claims

# Bot durable and acceptance jobs run on demand: a manual run, or a PR labelled `full-ci`.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playerbots-target-claims-${{ github.ref }}
  cancel-in-progress: true

jobs:
  durable:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'full-ci') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: 1.93.0
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_PROFILE_RELEASE_DEBUG: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: collection
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: LyraCoreProject/packages
          ref: 244ecfd63ee5d99f3cf855201479b9006654d5e8
          path: baseline
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: LyraCoreProject/LyraCore
          # Core main before the three-argument client-command marker, which the baseline predates.
          ref: 0cae690301552430d713a582b0036e7096c215d2
          path: baseline-core
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: LyraCoreProject/LyraCore
          ref: 6ad7a35276e619678a9c8d2ef7f6395473c22dc5
          path: lyracore
          persist-credentials: false
      - name: Install pinned Rust and SpacetimeDB
        run: |
          rustup toolchain install 1.93.0 --profile minimal
          rustup target add wasm32-unknown-unknown --toolchain 1.93.0
          archive="$RUNNER_TEMP/spacetime.tar.gz"
          curl --fail --location --retry 3 \
            https://github.com/clockworklabs/SpacetimeDB/releases/download/v2.7.1/spacetime-x86_64-unknown-linux-gnu.tar.gz \
            --output "$archive"
          printf '%s  %s\n' 9b58192135733083479f30aba47dbbbc79b51db368c46cc221baa663e9c3a2c1 "$archive" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/spacetime"
          tar -xzf "$archive" -C "$RUNNER_TEMP/spacetime"
          ln -s spacetimedb-cli "$RUNNER_TEMP/spacetime/spacetime"
          echo "$RUNNER_TEMP/spacetime" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: lyracore
      - name: Build the published Package baseline for additive migration
        working-directory: baseline-core
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/claim-baseline-target
        run: |
          ../baseline/.github/check-core-tip.sh "$GITHUB_WORKSPACE/baseline-core" \
            cargo build --manifest-path "$GITHUB_WORKSPACE/baseline-core/Cargo.toml" --locked \
            --release --target wasm32-unknown-unknown -p lyracore-module --features=debug_reducers
          cp "$CARGO_TARGET_DIR/wasm32-unknown-unknown/release/lyracore_module.wasm" "$RUNNER_TEMP/claim-baseline.wasm"
          echo "PLAYERBOTS_CLAIM_BASELINE_WASM=$RUNNER_TEMP/claim-baseline.wasm" >> "$GITHUB_ENV"
      - name: Verify solo target claims through the Runner
        run: ./collection/.github/check-playerbots-target-claims.sh "$GITHUB_WORKSPACE/lyracore"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: playerbots-target-claims-evidence
          path: /tmp/lyracore-standalone-logs/
          if-no-files-found: error
