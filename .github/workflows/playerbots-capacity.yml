name: Playerbots capacity and movement ownership

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playerbots-capacity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  durable:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: 1.93.0
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_PROFILE_RELEASE_DEBUG: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: collection
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: LyraCoreProject/packages
          ref: e134b135099a7d358a0f0fab58654c200602b9b1
          path: baseline
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: LyraCoreProject/LyraCore
          # Core supplies the shared private integration fixtures.
          ref: cf12a5046a3d91997d35ead52905fa9b6c4e6ce2
          path: lyracore
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: LyraCoreProject/LyraCore
          ref: 12a6f146e86c3b9d8a1aaeb8099a37023ea205b2
          path: preceding-capacity-core
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: LyraCoreProject/LyraCore
          ref: 286e8404d3399b2849ae4a34a253f190e2fd7c05
          path: preceding-movement-core
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: LyraCoreProject/packages
          ref: 859f296b942e714cc934db89e7d0be06fa049e18
          path: preceding-movement-collection
          persist-credentials: false
      - name: Install pinned Rust and SpacetimeDB
        run: |
          rustup toolchain install 1.93.0 --profile minimal
          rustup target add wasm32-unknown-unknown --toolchain 1.93.0
          archive="$RUNNER_TEMP/spacetime.tar.gz"
          curl --fail --location --retry 3 \
            https://github.com/clockworklabs/SpacetimeDB/releases/download/v2.7.1/spacetime-x86_64-unknown-linux-gnu.tar.gz \
            --output "$archive"
          printf '%s  %s\n' 9b58192135733083479f30aba47dbbbc79b51db368c46cc221baa663e9c3a2c1 "$archive" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/spacetime"
          tar -xzf "$archive" -C "$RUNNER_TEMP/spacetime"
          ln -s spacetimedb-cli "$RUNNER_TEMP/spacetime/spacetime"
          echo "$RUNNER_TEMP/spacetime" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: lyracore
      - name: Build the published Package baseline for additive migration
        working-directory: preceding-capacity-core
        # A separate target directory keeps Cargo from reusing baseline artifacts for the current
        # build, which differs only in where the Package symlinks point.
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/capacity-baseline-target
        run: |
          ../baseline/.github/check-core-tip.sh "$GITHUB_WORKSPACE/preceding-capacity-core" \
            cargo build --manifest-path "$GITHUB_WORKSPACE/preceding-capacity-core/Cargo.toml" --locked \
            --release --target wasm32-unknown-unknown -p lyracore-module --features=debug_reducers
          cp "$CARGO_TARGET_DIR/wasm32-unknown-unknown/release/lyracore_module.wasm" "$RUNNER_TEMP/capacity-baseline.wasm"
          echo "PLAYERBOTS_CAPACITY_PRECEDING_WASM=$RUNNER_TEMP/capacity-baseline.wasm" >> "$GITHUB_ENV"
      - name: Build the preceding movement schema for populated migration
        working-directory: preceding-movement-core
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/movement-baseline-target
        run: |
          "$GITHUB_WORKSPACE/preceding-movement-collection/.github/check-core-tip.sh" "$GITHUB_WORKSPACE/preceding-movement-core" \
            cargo build --locked --release --target wasm32-unknown-unknown \
            -p lyracore-module --features=debug_reducers
          cp "$CARGO_TARGET_DIR/wasm32-unknown-unknown/release/lyracore_module.wasm" "$RUNNER_TEMP/movement-baseline.wasm"
          sha256sum "$RUNNER_TEMP/movement-baseline.wasm" > "$RUNNER_TEMP/movement-baseline.sha256"
          echo "PLAYERBOTS_MOVEMENT_PRECEDING_WASM=$RUNNER_TEMP/movement-baseline.wasm" >> "$GITHUB_ENV"
      - name: Verify bounded planning, movement ownership, starting areas and additive migration
        env:
          PLAYERBOTS_CAPACITY_COUNT: 100
          PLAYERBOTS_CAPACITY_WORLDS: 1
        run: |
          ./collection/.github/check-core-tip.sh "$GITHUB_WORKSPACE/lyracore" \
            bash -eu -o pipefail -c '
              cd "$GITHUB_WORKSPACE/lyracore"
              python3 "$GITHUB_WORKSPACE/collection/.github/run-playerbots-tests.py" "$GITHUB_WORKSPACE/lyracore" test --locked --test playerbots_movement_upgrade \
                -- --ignored --test-threads=1 --nocapture
              python3 "$GITHUB_WORKSPACE/collection/.github/run-playerbots-tests.py" "$GITHUB_WORKSPACE/lyracore" test --locked --test playerbots_capacity \
                -- --ignored --test-threads=1 --nocapture \
                --skip playerbots_capacity_profile_imported_navigation
              python3 "$GITHUB_WORKSPACE/collection/.github/run-playerbots-tests.py" "$GITHUB_WORKSPACE/lyracore" test --locked --test playerbots_transfer \
                playerbots_legacy_crossing_ -- --ignored --test-threads=1 --nocapture
            '
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: playerbots-capacity-evidence
          path: |
            /tmp/lyracore-standalone-logs/
            ${{ runner.temp }}/movement-baseline.sha256
          if-no-files-found: error
