name: Playerbots class behavior

# Bot durable and acceptance jobs run on demand: a manual run, or a PR labelled `full-ci`.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playerbots-class-${{ github.ref }}
  cancel-in-progress: true

jobs:
  durable:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'full-ci') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: 1.97.1
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_PROFILE_RELEASE_DEBUG: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: collection
          persist-credentials: false
      - name: Select the paired Core revision
        id: core-ref
        uses: ./collection/.github/actions/core-ref
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: LyraCoreProject/LyraCore
          ref: ${{ steps.core-ref.outputs.ref }}
          path: lyracore
          persist-credentials: false
      - name: Install pinned Rust and SpacetimeDB
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup target add wasm32-unknown-unknown --toolchain 1.97.1
          archive="$RUNNER_TEMP/spacetime.tar.gz"
          curl --fail --location --retry 3 \
            https://github.com/clockworklabs/SpacetimeDB/releases/download/v2.14.0/spacetime-x86_64-unknown-linux-gnu.tar.gz \
            --output "$archive"
          printf '%s  %s\n' 2d8950dc3c67910aa80aa7612efddb5ee6ed53c443573f617b3ad65fef2aa084 "$archive" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/spacetime"
          tar -xzf "$archive" -C "$RUNNER_TEMP/spacetime"
          ln -s spacetimedb-cli "$RUNNER_TEMP/spacetime/spacetime"
          echo "$RUNNER_TEMP/spacetime" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: lyracore
      - name: Verify shared class behavior through the Runner
        run: ./collection/.github/check-playerbots-class-behavior.sh "$GITHUB_WORKSPACE/lyracore"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: playerbots-class-evidence
          path: /tmp/lyracore-standalone-logs/
          if-no-files-found: error
