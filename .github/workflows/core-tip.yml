name: Core tip compatibility

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-tip-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firewall:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out Packages
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test and enforce the no-committed-Package-Delta firewall
        run: |
          ./.github/test-artifact-firewall.sh
          ./.github/check-artifact-firewall.sh

  module:
    needs: firewall
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out Packages
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: collection
          persist-credentials: false

      - name: Check out LyraCore main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: LyraCoreProject/LyraCore
          ref: main
          path: lyracore
          persist-credentials: false

      - name: Install Rust 1.93.0
        run: rustup toolchain install 1.93.0 --profile minimal

      - name: Compile every Package against core tip
        run: ./collection/.github/check-core-tip.sh "$GITHUB_WORKSPACE/lyracore"

  datascripts:
    needs: firewall
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out Packages
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: collection
          persist-credentials: false

      - name: Check out LyraCore main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: LyraCoreProject/LyraCore
          ref: main
          path: lyracore
          persist-credentials: false

      # `spacetime generate` builds the module to wasm and extracts its schema through it, so this
      # job needs the same toolchain + target the `module` job's compile check needs, plus the
      # wasm target neither that job nor `check-core-tip.sh` requires.
      - name: Install Rust 1.93.0
        run: |
          rustup toolchain install 1.93.0 --profile minimal
          rustup target add wasm32-unknown-unknown --toolchain 1.93.0

      # Pinned to the version LyraCore's module/Cargo.toml and gateway/Cargo.toml pin today
      # (LyraCore's own `lyracore preflight` reads its pin from that checkout at run time; this
      # workflow cannot, so the version here has to be kept in step with core's by hand — the same
      # maintenance the "Install Rust 1.93.0" step above already carries).
      - name: Install the pinned SpacetimeDB CLI
        run: |
          # The install script no longer takes a version flag; the CLI's own version manager
          # does the pinning now.
          curl -sSf https://install.spacetimedb.com | sh -s -- --yes
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/spacetime" version install 2.7.1
          "$HOME/.local/bin/spacetime" version use 2.7.1

      - name: Install the pinned Bun
        run: |
          curl -fsSL https://bun.sh/install | bash -s "bun-v1.3.7"
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"

      # `./lyracore` is a pinned shim: it installs the exact CLI revision LyraCore's own
      # `.lyracore-cli-rev` names, the first time anything runs it (docs/agents/cross-repo-cli.md
      # in LyraCore). Running it once here, on its own, keeps that install's own log separate from
      # the check that follows.
      - name: Install the pinned lyracore CLI
        run: (cd lyracore && ./lyracore --help >/dev/null)

      - name: Verify committed Script Artifacts against core tip
        run: |
          ./collection/.github/check-core-tip.sh "$GITHUB_WORKSPACE/lyracore" \
            "$GITHUB_WORKSPACE/collection/.github/check-datascripts.sh" "$GITHUB_WORKSPACE/lyracore"

  playerbots-durable:
    needs: firewall
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RUSTUP_TOOLCHAIN: 1.93.0
      SPACETIME_VERSION: 2.7.1
      SPACETIME_ARCHIVE_SHA256: 9b58192135733083479f30aba47dbbbc79b51db368c46cc221baa663e9c3a2c1
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_PROFILE_RELEASE_DEBUG: 0
    steps:
      - name: Check out Packages
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: collection
          persist-credentials: false
      - name: Check out the PB-009 Core candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: LyraCoreProject/LyraCore
          # Merged PB-009 Core supplies the companion command relay and durable fixture corrections.
          ref: 2f2b1f35dde90e52dd3b0d3e16d44bb3ffe41a2d
          path: lyracore
          persist-credentials: false
      - name: Install the Rust toolchain and Wasm target
        run: |
          rustup toolchain install 1.93.0 --profile minimal
          rustup target add wasm32-unknown-unknown --toolchain 1.93.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: lyracore
      - name: Install the pinned SpacetimeDB CLI
        run: |
          archive_path="$RUNNER_TEMP/spacetime.tar.gz"
          cli_dir="$RUNNER_TEMP/spacetime-$SPACETIME_VERSION"
          curl --fail --location --retry 3 \
            "https://github.com/clockworklabs/SpacetimeDB/releases/download/v$SPACETIME_VERSION/spacetime-x86_64-unknown-linux-gnu.tar.gz" \
            --output "$archive_path"
          printf '%s  %s\n' "$SPACETIME_ARCHIVE_SHA256" "$archive_path" | sha256sum --check --strict
          mkdir -p "$cli_dir"
          tar --extract --gzip --file "$archive_path" --directory "$cli_dir"
          ln -s spacetimedb-cli "$cli_dir/spacetime"
          echo "$cli_dir" >> "$GITHUB_PATH"
      - name: Check out the preceding Module source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: LyraCoreProject/LyraCore
          ref: be3fa67d0f0c24749230560544a3e8e8b577f61d
          path: preceding-core
          persist-credentials: false
      - name: Check out the preceding Package source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: LyraCoreProject/packages
          ref: 5724de1660a2628e88320914bdd5abb0c69da517
          path: preceding-collection
          persist-credentials: false
      - name: Build the pinned preceding Wasm for populated migration
        working-directory: preceding-core
        env:
          CARGO_BUILD_JOBS: 2
          CARGO_INCREMENTAL: 0
        run: |
          export CARGO_TARGET_DIR="$RUNNER_TEMP/playerbots-legacy-preceding-target"
          cargo clean --manifest-path "$GITHUB_WORKSPACE/preceding-core/Cargo.toml" -p lyracore-module
          "$GITHUB_WORKSPACE/preceding-collection/.github/check-core-tip.sh" "$GITHUB_WORKSPACE/preceding-core" \
            cargo build --manifest-path "$GITHUB_WORKSPACE/preceding-core/Cargo.toml" \
            --locked --release --target wasm32-unknown-unknown -p lyracore-module --features=debug_reducers
          cp "$CARGO_TARGET_DIR/wasm32-unknown-unknown/release/lyracore_module.wasm" "$RUNNER_TEMP/playerbots-preceding.wasm"
          echo "PLAYERBOTS_PRECEDING_WASM=$RUNNER_TEMP/playerbots-preceding.wasm" >> "$GITHUB_ENV"
      - name: Check out the merged PB-002 Module source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: LyraCoreProject/LyraCore
          ref: e6a755db0a150bbf73ad97b972fe829f20f6816c
          path: preceding-pb002-core
          persist-credentials: false
      - name: Check out the merged PB-002 Package source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: LyraCoreProject/packages
          ref: 155c9e401afb06d5731acedf8fc35a81dbe4aaa6
          path: preceding-pb002-collection
          persist-credentials: false
      - name: Build the merged PB-002 Wasm for populated companion migration
        working-directory: preceding-pb002-core
        run: |
          export CARGO_TARGET_DIR="$RUNNER_TEMP/playerbots-pb002-preceding-target"
          cargo clean --manifest-path "$GITHUB_WORKSPACE/preceding-pb002-core/Cargo.toml" -p lyracore-module
          "$GITHUB_WORKSPACE/preceding-pb002-collection/.github/check-core-tip.sh" "$GITHUB_WORKSPACE/preceding-pb002-core" \
            cargo build --manifest-path "$GITHUB_WORKSPACE/preceding-pb002-core/Cargo.toml" \
            --locked --release --target wasm32-unknown-unknown -p lyracore-module --features=debug_reducers
          cp "$CARGO_TARGET_DIR/wasm32-unknown-unknown/release/lyracore_module.wasm" "$RUNNER_TEMP/playerbots-pb002-preceding.wasm"
          python3 - "$RUNNER_TEMP/playerbots-pb002-preceding.wasm" \
            "$GITHUB_WORKSPACE/preceding-pb002-core" \
            "$GITHUB_WORKSPACE/preceding-pb002-collection" \
            "$RUNNER_TEMP/playerbots-pb002-preceding-inputs.json" <<'PY'
          import datetime
          import hashlib
          import json
          import pathlib
          import subprocess
          import sys

          wasm_path, core_path, collection_path, manifest_path = map(pathlib.Path, sys.argv[1:])

          def git(path, *args):
              return subprocess.run(
                  ["git", *args], cwd=path, check=True, text=True, capture_output=True
              ).stdout.strip()

          if git(core_path, "status", "--porcelain"):
              raise SystemExit("the preceding PB-002 Module checkout is dirty")
          if git(collection_path, "status", "--porcelain"):
              raise SystemExit("the preceding PB-002 Package checkout is dirty")

          wasm = wasm_path.read_bytes()
          rust_detail = subprocess.run(
              ["rustc", "--version"], check=True, text=True, capture_output=True
          ).stdout.strip()
          spacetime_detail = subprocess.run(
              ["spacetime", "--version"], check=True, text=True, capture_output=True
          ).stdout.strip()
          installed_packages = sorted(
              path.name
              for root in (core_path / "packages", collection_path)
              for path in root.iterdir()
              if path.is_dir() and not path.name.startswith(".")
          )
          manifest = {
              "created_at": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "core": git(core_path, "rev-parse", "HEAD"),
              "collection": git(collection_path, "rev-parse", "HEAD"),
              "core_tree": git(core_path, "rev-parse", "HEAD^{tree}"),
              "collection_tree": git(collection_path, "rev-parse", "HEAD^{tree}"),
              "playerbots_tree": git(collection_path, "rev-parse", "HEAD:playerbots"),
              "core_dirty": False,
              "collection_dirty": False,
              "rust": rust_detail.split()[1],
              "rust_detail": rust_detail,
              "spacetimedb": spacetime_detail.split("spacetimedb tool version ", 1)[1].split(";", 1)[0],
              "spacetimedb_detail": spacetime_detail,
              "target": "wasm32-unknown-unknown",
              "profile": "release",
              "features": ["debug_reducers"],
              "installed_packages": installed_packages,
              "wasm_bytes": len(wasm),
              "wasm_sha256": hashlib.sha256(wasm).hexdigest(),
              "package_content_identity": "33fcb8a217aad84f46f9ad65efdad23be24bad8e29828777de7c7e6469417161",
              "verification": "Build input from clean merged PB-002 checkouts. The consumer verifies the source identities, Package content, and this environment's Wasm digest before publish and populated upgrade.",
          }
          manifest_path.write_text(json.dumps(manifest, indent=2) + "\n")
          PY
          echo "PLAYERBOTS_CATALOG_PRECEDING_WASM=$RUNNER_TEMP/playerbots-pb002-preceding.wasm" >> "$GITHUB_ENV"
          echo "PLAYERBOTS_COMPANION_PRECEDING_WASM=$RUNNER_TEMP/playerbots-pb002-preceding.wasm" >> "$GITHUB_ENV"
          echo "PLAYERBOTS_PB002_WASM=$RUNNER_TEMP/playerbots-pb002-preceding.wasm" >> "$GITHUB_ENV"
          echo "PLAYERBOTS_COMPANION_PRECEDING_MANIFEST=$RUNNER_TEMP/playerbots-pb002-preceding-inputs.json" >> "$GITHUB_ENV"
          echo "PLAYERBOTS_COMPANION_PRECEDING_CORE=$GITHUB_WORKSPACE/preceding-pb002-core" >> "$GITHUB_ENV"
          echo "PLAYERBOTS_COMPANION_PRECEDING_COLLECTION=$GITHUB_WORKSPACE/preceding-pb002-collection" >> "$GITHUB_ENV"
      - name: Check out the merged PB-006 Module source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: LyraCoreProject/LyraCore
          ref: dae05c1b78cfd4b59f24968ec8be41f75ce896d1
          path: preceding-roles-core
          persist-credentials: false
      - name: Check out the merged PB-006 Package source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: LyraCoreProject/packages
          ref: 2028771d15c8efe87b50d2b6795315221953055d
          path: preceding-roles-collection
          persist-credentials: false
      - name: Build the merged PB-006 Wasm for populated role migration
        working-directory: preceding-roles-core
        run: |
          export CARGO_TARGET_DIR="$RUNNER_TEMP/playerbots-roles-preceding-target"
          cargo clean --manifest-path "$GITHUB_WORKSPACE/preceding-roles-core/Cargo.toml" -p lyracore-module
          "$GITHUB_WORKSPACE/preceding-roles-collection/.github/check-core-tip.sh" "$GITHUB_WORKSPACE/preceding-roles-core" \
            cargo build --manifest-path "$GITHUB_WORKSPACE/preceding-roles-core/Cargo.toml" \
            --locked --release --target wasm32-unknown-unknown -p lyracore-module --features=debug_reducers
          wasm_path="$RUNNER_TEMP/playerbots-roles-preceding.wasm"
          manifest_path="$RUNNER_TEMP/playerbots-roles-preceding-inputs.json"
          cp "$CARGO_TARGET_DIR/wasm32-unknown-unknown/release/lyracore_module.wasm" "$wasm_path"
          python3 - "$wasm_path" \
            "$GITHUB_WORKSPACE/preceding-roles-core" \
            "$GITHUB_WORKSPACE/preceding-roles-collection" "$manifest_path" <<'PY'
          import hashlib
          import json
          import pathlib
          import subprocess
          import sys

          wasm_path, core_path, collection_path, manifest_path = map(pathlib.Path, sys.argv[1:])

          def git(path, *args):
              return subprocess.run(
                  ["git", *args], cwd=path, check=True, text=True, capture_output=True
              ).stdout.strip()

          if git(core_path, "status", "--porcelain"):
              raise SystemExit("the preceding role Module checkout is dirty")
          if git(collection_path, "status", "--porcelain"):
              raise SystemExit("the preceding role Package checkout is dirty")
          wasm = wasm_path.read_bytes()
          rust = subprocess.run(
              ["rustc", "--version"], check=True, text=True, capture_output=True
          ).stdout.strip()
          spacetime = subprocess.run(
              ["spacetime", "--version"], check=True, text=True, capture_output=True
          ).stdout.strip()
          installed = sorted(
              path.name
              for root in (core_path / "packages", collection_path)
              for path in root.iterdir()
              if path.is_dir() and not path.name.startswith(".")
          )
          manifest = {
              "core": git(core_path, "rev-parse", "HEAD"),
              "collection": git(collection_path, "rev-parse", "HEAD"),
              "core_tree": git(core_path, "rev-parse", "HEAD^{tree}"),
              "collection_tree": git(collection_path, "rev-parse", "HEAD^{tree}"),
              "playerbots_tree": git(collection_path, "rev-parse", "HEAD:playerbots"),
              "core_dirty": False,
              "collection_dirty": False,
              "rust": rust.split()[1],
              "rust_detail": rust,
              "spacetimedb": spacetime.split("spacetimedb tool version ", 1)[1].split(";", 1)[0],
              "spacetimedb_detail": spacetime,
              "target": "wasm32-unknown-unknown",
              "profile": "release",
              "features": ["debug_reducers"],
              "installed_packages": installed,
              "wasm_bytes": len(wasm),
              "wasm_sha256": hashlib.sha256(wasm).hexdigest(),
              "package_content_identity": "573c5856e3a261e073a7bd414e2183efa7f6dcec823a47d0c190d29b1aab3db4",
              "verification": "Clean merged PB-006 inputs for the populated PB-004 upgrade test.",
          }
          manifest_path.write_text(json.dumps(manifest, indent=2) + "\n")
          PY
          echo "PLAYERBOTS_ROLES_PRECEDING_WASM=$wasm_path" >> "$GITHUB_ENV"
          echo "PLAYERBOTS_ROLES_PRECEDING_MANIFEST=$manifest_path" >> "$GITHUB_ENV"
          echo "PLAYERBOTS_ROLES_PRECEDING_CORE=$GITHUB_WORKSPACE/preceding-roles-core" >> "$GITHUB_ENV"
          echo "PLAYERBOTS_ROLES_PRECEDING_COLLECTION=$GITHUB_WORKSPACE/preceding-roles-collection" >> "$GITHUB_ENV"
      - name: Check out the merged PB-004 Module source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: LyraCoreProject/LyraCore
          ref: fd6d230df3a75f642de36ceb4d56fb594aa3215d
          path: preceding-quest-core
          persist-credentials: false
      - name: Check out the merged PB-004 Package source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: LyraCoreProject/packages
          ref: 4c883874854e64d942d85938533ed45b9bd725b2
          path: preceding-quest-collection
          persist-credentials: false
      - name: Build the merged PB-004 Wasm for populated quest migration
        working-directory: preceding-quest-core
        run: |
          export CARGO_TARGET_DIR="$RUNNER_TEMP/playerbots-quest-preceding-target"
          cargo clean --manifest-path "$GITHUB_WORKSPACE/preceding-quest-core/Cargo.toml" -p lyracore-module
          "$GITHUB_WORKSPACE/preceding-quest-collection/.github/check-core-tip.sh" \
            "$GITHUB_WORKSPACE/preceding-quest-core" \
            bash -eu -o pipefail -c '
              cargo build --manifest-path "$GITHUB_WORKSPACE/preceding-quest-core/Cargo.toml" \
                --locked --release --target wasm32-unknown-unknown \
                -p lyracore-module --features=debug_reducers
            '
          wasm_path="$RUNNER_TEMP/playerbots-quest-preceding.wasm"
          manifest_path="$RUNNER_TEMP/playerbots-quest-preceding-inputs.json"
          cp "$CARGO_TARGET_DIR/wasm32-unknown-unknown/release/lyracore_module.wasm" "$wasm_path"
          python3 - "$wasm_path" \
            "$GITHUB_WORKSPACE/preceding-quest-core" \
            "$GITHUB_WORKSPACE/preceding-quest-collection" "$manifest_path" <<'PY_MANIFEST'
          import hashlib
          import json
          import pathlib
          import subprocess
          import sys

          wasm_path, core_path, collection_path, manifest_path = map(pathlib.Path, sys.argv[1:])

          def git(path, *args):
              return subprocess.run(
                  ["git", *args], cwd=path, check=True, text=True, capture_output=True
              ).stdout.strip()

          if git(core_path, "status", "--porcelain"):
              raise SystemExit("the preceding PB-004 Module checkout is dirty")
          if git(collection_path, "status", "--porcelain"):
              raise SystemExit("the preceding PB-004 Package checkout is dirty")
          wasm = wasm_path.read_bytes()
          rust = subprocess.run(
              ["rustc", "--version"], check=True, text=True, capture_output=True
          ).stdout.strip()
          spacetime = subprocess.run(
              ["spacetime", "--version"], check=True, text=True, capture_output=True
          ).stdout.strip()
          installed = sorted(
              path.name
              for root in (core_path / "packages", collection_path)
              for path in root.iterdir()
              if path.is_dir() and not path.name.startswith(".")
          )
          manifest = {
              "core": git(core_path, "rev-parse", "HEAD"),
              "collection": git(collection_path, "rev-parse", "HEAD"),
              "core_tree": git(core_path, "rev-parse", "HEAD^{tree}"),
              "collection_tree": git(collection_path, "rev-parse", "HEAD^{tree}"),
              "playerbots_tree": git(collection_path, "rev-parse", "HEAD:playerbots"),
              "core_dirty": False,
              "collection_dirty": False,
              "rust": rust.split()[1],
              "rust_detail": rust,
              "spacetimedb": spacetime.split("spacetimedb tool version ", 1)[1].split(";", 1)[0],
              "spacetimedb_detail": spacetime,
              "target": "wasm32-unknown-unknown",
              "profile": "release",
              "features": ["debug_reducers"],
              "installed_packages": installed,
              "wasm_bytes": len(wasm),
              "wasm_sha256": hashlib.sha256(wasm).hexdigest(),
              "package_content_identity": "b0257f1f79baeb69a1817cd9d4f4b0c6c1d87db42d5a4267de323db81fc89aac",
              "verification": "Clean merged PB-004 inputs for the populated PB-007 upgrade test.",
          }
          manifest_path.write_text(json.dumps(manifest, indent=2) + "\n")
          PY_MANIFEST
          echo "PLAYERBOTS_QUEST_PRECEDING_WASM=$wasm_path" >> "$GITHUB_ENV"
          echo "PLAYERBOTS_QUEST_PRECEDING_MANIFEST=$manifest_path" >> "$GITHUB_ENV"
          echo "PLAYERBOTS_QUEST_PRECEDING_CORE=$GITHUB_WORKSPACE/preceding-quest-core" >> "$GITHUB_ENV"
          echo "PLAYERBOTS_QUEST_PRECEDING_COLLECTION=$GITHUB_WORKSPACE/preceding-quest-collection" >> "$GITHUB_ENV"
      - name: Check out the merged PB-007 Module source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: LyraCoreProject/LyraCore
          ref: c600a7cc3887508012a512c77d7fefc128cf791d
          path: preceding-recovery-core
          persist-credentials: false
      - name: Check out the merged PB-007 Package source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: LyraCoreProject/packages
          ref: a17e5ec7120de21fe9ccc75c3b8fcc998be35df8
          path: preceding-recovery-collection
          persist-credentials: false
      - name: Build the merged PB-007 Wasm for populated recovery migration
        working-directory: preceding-recovery-core
        run: |
          export CARGO_TARGET_DIR="$RUNNER_TEMP/playerbots-recovery-preceding-target"
          cargo clean --manifest-path "$GITHUB_WORKSPACE/preceding-recovery-core/Cargo.toml" -p lyracore-module
          "$GITHUB_WORKSPACE/preceding-recovery-collection/.github/check-core-tip.sh" \
            "$GITHUB_WORKSPACE/preceding-recovery-core" \
            bash -eu -o pipefail -c '
              cargo build --manifest-path "$GITHUB_WORKSPACE/preceding-recovery-core/Cargo.toml" \
                --locked --release --target wasm32-unknown-unknown \
                -p lyracore-module --features=debug_reducers
            '
          wasm_path="$RUNNER_TEMP/playerbots-recovery-preceding.wasm"
          manifest_path="$RUNNER_TEMP/playerbots-recovery-preceding-inputs.json"
