          "$GITHUB_WORKSPACE/collection/.github/check-core-tip.sh" "$GITHUB_WORKSPACE/lyracore" \
            bash -eu -o pipefail -c '
              cargo build --manifest-path "$GITHUB_WORKSPACE/lyracore/Cargo.toml" \
                --locked --release --target wasm32-unknown-unknown \
                -p lyracore-module --features=debug_reducers
              cargo test --manifest-path "$GITHUB_WORKSPACE/lyracore/Cargo.toml" \
                --locked -p lyracore-module --test playerbots_acceptance --no-run

              listed="$RUNNER_TEMP/playerbots-acceptance-${ACCEPTANCE_CLASS}-listed.txt"
              cargo test --manifest-path "$GITHUB_WORKSPACE/lyracore/Cargo.toml" \
                --locked -p lyracore-module --test playerbots_acceptance \
                -- --ignored --list > "$listed"
              actual="$RUNNER_TEMP/playerbots-acceptance-${ACCEPTANCE_CLASS}-actual.txt"
              expected="$RUNNER_TEMP/playerbots-acceptance-${ACCEPTANCE_CLASS}-expected.txt"
              sed -n "s/: test$//p" "$listed" | grep "^${ACCEPTANCE_FILTER}" | sort > "$actual"
              printf "%s\n" "$ACCEPTANCE_EXPECTED_TESTS" | sed "/^[[:space:]]*$/d" | sort > "$expected"
              test "$(wc -l < "$expected")" -eq 10
              test "$(wc -l < "$actual")" -eq 10
              diff -u "$expected" "$actual"
              if test "$ACCEPTANCE_RUN_LEVEL_GAP" = true; then
                sed -n "s/: test$//p" "$listed" | \
                  grep -Fx "playerbots_acceptance_level_gap_uses_ordinary_kill_xp" > \
                  "$RUNNER_TEMP/playerbots-acceptance-level-gap-listed.txt"
                test "$(wc -l < "$RUNNER_TEMP/playerbots-acceptance-level-gap-listed.txt")" -eq 1
              fi

              wasm="$CARGO_TARGET_DIR/wasm32-unknown-unknown/release/lyracore_module.wasm"
              manifest="$RUNNER_TEMP/playerbots-acceptance-${ACCEPTANCE_CLASS}-inputs.json"
              python3 - "$wasm" "$GITHUB_WORKSPACE/lyracore" \
                "$GITHUB_WORKSPACE/collection" "$manifest" "$expected" <<"PY_MANIFEST"
          import hashlib
          import json
          import os
          import pathlib
          import subprocess
          import sys

          wasm_path, core_path, collection_path, manifest_path, expected_path = map(
              pathlib.Path, sys.argv[1:]
          )

          def git(path, *args):
              return subprocess.run(
                  ["git", *args], cwd=path, check=True, text=True, capture_output=True
              ).stdout.strip()

          if git(core_path, "status", "--porcelain"):
              raise SystemExit("the PB-011 Core checkout is dirty")
          if git(collection_path, "status", "--porcelain"):
              raise SystemExit("the PB-011 Package checkout is dirty")
          wasm = wasm_path.read_bytes()
          rust = subprocess.run(
              ["rustc", "--version"], check=True, text=True, capture_output=True
          ).stdout.strip()
          spacetime = subprocess.run(
              ["spacetime", "--version"], check=True, text=True, capture_output=True
          ).stdout.strip()
          manifest = {
              "core": git(core_path, "rev-parse", "HEAD"),
              "package": git(collection_path, "rev-parse", "HEAD"),
              "core_tree": git(core_path, "rev-parse", "HEAD^{tree}"),
              "package_tree": git(collection_path, "rev-parse", "HEAD^{tree}"),
              "playerbots_tree": git(collection_path, "rev-parse", "HEAD:playerbots"),
              "core_dirty": False,
              "package_dirty": False,
              "rust": rust,
              "spacetimedb": spacetime,
              "target": "wasm32-unknown-unknown",
              "profile": "release",
              "features": ["debug_reducers"],
              "wasm_bytes": len(wasm),
              "wasm_sha256": hashlib.sha256(wasm).hexdigest(),
              "acceptance_class": os.environ["ACCEPTANCE_CLASS"],
              "expected_journey_tests": expected_path.read_text().splitlines(),
              "level_gap_test": "playerbots_acceptance_level_gap_uses_ordinary_kill_xp"
              if os.environ["ACCEPTANCE_RUN_LEVEL_GAP"] == "true"
              else None,
          }
          manifest_path.write_text(json.dumps(manifest, indent=2) + "\n")
          PY_MANIFEST

              set +e
              cargo test --manifest-path "$GITHUB_WORKSPACE/lyracore/Cargo.toml" \
                --locked -p lyracore-module --test playerbots_acceptance --no-fail-fast \
                "$ACCEPTANCE_FILTER" -- --ignored --nocapture --test-threads=1 \
                2>&1 | tee "$RUNNER_TEMP/playerbots-acceptance-${ACCEPTANCE_CLASS}.log"
              class_statuses=("${PIPESTATUS[@]}")
              class_cargo_status=${class_statuses[0]}
              class_tee_status=${class_statuses[1]}
              level_gap_cargo_status=0
              level_gap_tee_status=0
              level_gap_cargo_record=not-run
              level_gap_tee_record=not-run
              if test "$ACCEPTANCE_RUN_LEVEL_GAP" = true; then
                cargo test --manifest-path "$GITHUB_WORKSPACE/lyracore/Cargo.toml" \
                  --locked -p lyracore-module --test playerbots_acceptance --no-fail-fast \
                  playerbots_acceptance_level_gap_uses_ordinary_kill_xp -- \
                  --ignored --exact --nocapture --test-threads=1 \
                  2>&1 | tee "$RUNNER_TEMP/playerbots-acceptance-level-gap.log"
                level_gap_statuses=("${PIPESTATUS[@]}")
                level_gap_cargo_status=${level_gap_statuses[0]}
                level_gap_tee_status=${level_gap_statuses[1]}
                level_gap_cargo_record=$level_gap_cargo_status
                level_gap_tee_record=$level_gap_tee_status
              fi
              set -e
              printf "cargo=%s\ntee=%s\n" \
                "$class_cargo_status" "$class_tee_status" > \
                "$RUNNER_TEMP/playerbots-acceptance-${ACCEPTANCE_CLASS}-status.txt"
              printf "cargo=%s\ntee=%s\n" \
                "$level_gap_cargo_record" "$level_gap_tee_record" > \
                "$RUNNER_TEMP/playerbots-acceptance-level-gap-status.txt"
              if test "$class_cargo_status" -ne 0 || \
                test "$class_tee_status" -ne 0 || \
                test "$level_gap_cargo_status" -ne 0 || \
                test "$level_gap_tee_status" -ne 0; then
                exit 1
              fi
            '
      - name: Upload ${{ matrix.class_name }} acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playerbots-acceptance-${{ matrix.class_name }}-evidence
          path: |
            /tmp/lyracore-standalone-logs
            ${{ runner.temp }}/playerbots-acceptance-${{ matrix.class_name }}-inputs.json
            ${{ runner.temp }}/playerbots-acceptance-${{ matrix.class_name }}-listed.txt
            ${{ runner.temp }}/playerbots-acceptance-${{ matrix.class_name }}-actual.txt
            ${{ runner.temp }}/playerbots-acceptance-${{ matrix.class_name }}-expected.txt
            ${{ runner.temp }}/playerbots-acceptance-${{ matrix.class_name }}-status.txt
            ${{ runner.temp }}/playerbots-acceptance-${{ matrix.class_name }}.log
            ${{ runner.temp }}/playerbots-acceptance-level-gap-listed.txt
            ${{ runner.temp }}/playerbots-acceptance-level-gap-status.txt
            ${{ runner.temp }}/playerbots-acceptance-level-gap.log
            ${{ runner.temp }}/playerbots-acceptance-${{ matrix.class_name }}-target/wasm32-unknown-unknown/release/lyracore_module.wasm
          if-no-files-found: error


  playerbots-composition-durable:
    needs: firewall
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      RUSTUP_TOOLCHAIN: 1.93.0
      SPACETIME_VERSION: 2.7.1
      SPACETIME_ARCHIVE_SHA256: 9b58192135733083479f30aba47dbbbc79b51db368c46cc221baa663e9c3a2c1
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_PROFILE_RELEASE_DEBUG: 0
    steps:
      - name: Check out Packages
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: collection
          persist-credentials: false
      - name: Check out merged PB-011 Core
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: LyraCoreProject/LyraCore
          ref: 43592ceecf044ed6b6701bc42486ca6ab6ee981a
          path: lyracore
          persist-credentials: false
      - name: Install the Rust toolchain and Wasm target
        run: |
          rustup toolchain install 1.93.0 --profile minimal
          rustup target add wasm32-unknown-unknown --toolchain 1.93.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: lyracore
          shared-key: playerbots-composition
      - name: Install the pinned SpacetimeDB CLI
        run: |
          archive_path="$RUNNER_TEMP/spacetime.tar.gz"
          cli_dir="$RUNNER_TEMP/spacetime-$SPACETIME_VERSION"
          curl --fail --location --retry 3 \
            "https://github.com/clockworklabs/SpacetimeDB/releases/download/v$SPACETIME_VERSION/spacetime-x86_64-unknown-linux-gnu.tar.gz" \
            --output "$archive_path"
          printf '%s  %s\n' "$SPACETIME_ARCHIVE_SHA256" "$archive_path" | sha256sum --check --strict
          mkdir -p "$cli_dir"
          tar --extract --gzip --file "$archive_path" --directory "$cli_dir"
          ln -s spacetimedb-cli "$cli_dir/spacetime"
          echo "$cli_dir" >> "$GITHUB_PATH"
      - name: Check out the pinned Headless Client
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: LyraCoreProject/wire-harness
          ref: v0.1.0-alpha.13
          path: wire-client
          persist-credentials: false
      - name: Verify and build the Headless Client
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/playerbots-composition-target
        run: |
          test "$(git -C wire-client rev-parse HEAD)" = 68f4a0dec63feaba330efbb15f7730ccc4c1d805
          pin=$(sed '/^[[:space:]]*#/d; /^[[:space:]]*$/d' lyracore/.wire-harness-rev)
          test "$pin" = 'v0.1.0-alpha.13 68f4a0dec63feaba330efbb15f7730ccc4c1d805'
          cargo build --manifest-path wire-client/Cargo.toml --locked --release --bin vanilla-wire
          sha256sum "$CARGO_TARGET_DIR/release/vanilla-wire" > "$RUNNER_TEMP/playerbots-composition-wire.sha256"
      - name: Run the exact lifecycle and companion cases
        working-directory: lyracore
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/playerbots-composition-target
          LYRACORE_WIRE_BIN: ${{ runner.temp }}/playerbots-composition-target/release/vanilla-wire
          RUST_TEST_THREADS: 1
        run: |
          export COMPOSITION_CORE=$(git rev-parse HEAD)
          export COMPOSITION_COLLECTION=$(git -C "$GITHUB_WORKSPACE/collection" rev-parse HEAD)
          cargo clean --manifest-path "$GITHUB_WORKSPACE/lyracore/Cargo.toml" -p lyracore-module
          "$GITHUB_WORKSPACE/collection/.github/check-core-tip.sh" "$GITHUB_WORKSPACE/lyracore" \
            bash -eu -o pipefail -c '
              cargo build --manifest-path "$GITHUB_WORKSPACE/lyracore/Cargo.toml" \
                --locked --release --target wasm32-unknown-unknown \
                -p lyracore-module --features=debug_reducers
              sha256sum "$CARGO_TARGET_DIR/wasm32-unknown-unknown/release/lyracore_module.wasm" \
                > "$RUNNER_TEMP/playerbots-composition-wasm.sha256"
              set +e
              python3 "$GITHUB_WORKSPACE/collection/.github/run-playerbots-composition.py" \
                --core-root "$GITHUB_WORKSPACE/lyracore" \
                --collection-root "$GITHUB_WORKSPACE/collection" \
                --core "$COMPOSITION_CORE" --collection "$COMPOSITION_COLLECTION" \
                --evidence "$RUNNER_TEMP/playerbots-composition-executions"
              run_status=$?
              python3 "$GITHUB_WORKSPACE/lyracore/scripts/check-playerbots-action-lifecycle.py" \
                --manifest "$GITHUB_WORKSPACE/lyracore/module/tests/playerbots_action_lifecycle_manifest.json" \
                --core-root "$GITHUB_WORKSPACE/lyracore" \
                --package-root "$GITHUB_WORKSPACE/collection" \
                --core "$COMPOSITION_CORE" --collection "$COMPOSITION_COLLECTION" \
                --observed "$RUNNER_TEMP/playerbots-composition-executions/executions.json"
              checker_status=$?
              set -e
              printf "runs=%s\nchecker=%s\n" "$run_status" "$checker_status" \
                > "$RUNNER_TEMP/playerbots-composition-status.txt"
              test "$run_status" -eq 0 && test "$checker_status" -eq 0
            '
      - name: Upload lifecycle and companion execution evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playerbots-composition-evidence
          path: |
            /tmp/lyracore-standalone-logs
            ${{ runner.temp }}/playerbots-composition-executions
            ${{ runner.temp }}/playerbots-composition-status.txt
            ${{ runner.temp }}/playerbots-composition-wire.sha256
            ${{ runner.temp }}/playerbots-composition-wasm.sha256
            ${{ runner.temp }}/playerbots-composition-target/wasm32-unknown-unknown/release/lyracore_module.wasm
          if-no-files-found: error
