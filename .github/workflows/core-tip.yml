name: Core tip compatibility

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-tip-${{ github.ref }}
  cancel-in-progress: true

jobs:
  module:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out Packages
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: collection

      - name: Check out LyraCore main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: LyraCoreProject/LyraCore
          ref: main
          path: lyracore

      - name: Install Rust 1.93.0
        run: rustup toolchain install 1.93.0 --profile minimal

      - name: Compile every Package against core tip
        run: ./collection/.github/check-core-tip.sh "$GITHUB_WORKSPACE/lyracore"
