name: Paired Core revision
description: Keep the required Core revision for main; pair other branches with Core.
inputs:
  fallback:
    description: Core revision required by this collection.
    required: true
outputs:
  ref:
    description: Exact paired commit or required Core revision.
    value: ${{ steps.select.outputs.ref }}
runs:
  using: composite
  steps:
    - id: select
      shell: bash
      env:
        BRANCH: ${{ github.head_ref || github.ref_name }}
        BASE_BRANCH: ${{ github.base_ref }}
        FALLBACK: ${{ inputs.fallback }}
      run: |
        if [ "$BRANCH" = main ] || [ "$BASE_BRANCH" = main ]; then
          echo "ref=$FALLBACK" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        candidates=("$BRANCH" "$BASE_BRANCH")
        if [[ "$BRANCH" == vmangos/* ]]; then
          candidates+=(feat/vmangos-world-data)
        fi
        for candidate in "${candidates[@]}"; do
          [ -n "$candidate" ] || continue
          if paired=$(git ls-remote --exit-code --heads https://github.com/LyraCoreProject/LyraCore "refs/heads/$candidate"); then
            echo "ref=${paired%%[[:space:]]*}" >> "$GITHUB_OUTPUT"
            exit 0
          else
            status=$?
            [ "$status" -eq 2 ] || exit "$status"
          fi
        done
        echo "ref=$FALLBACK" >> "$GITHUB_OUTPUT"
